<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES! :D</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 40px;
            margin-bottom: 5px;
            font-size: 3rem;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.9);
        }

        .games-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        .game-button {
            display: block;
            text-decoration: none;
            text-align: center;
            background: white;
            color: #333;
            border-radius: 25px;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        .spacer {
            flex: 1;
        }

        .beta {
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.85);
        }
    </style>
</head>
<body>
    <h1>GAMES! :D</h1>
    <h2>BY: METE KAYA</h2>

    <div class="games-container">
        <a class="game-button" href="https://coffeefuelbump-cmd.github.io/Russian-roulette/" target="_blank" rel="noopener noreferrer">Russian Roulette</a>
        <a class="game-button" href="https://coffeefuelbump-cmd.github.io/Lucky-box/" target="_blank" rel="noopener noreferrer">Lucky Box</a>
        <a class="game-button" href="https://coffeefuelbump-cmd.github.io/starbird-skies/" target="_blank" rel="noopener noreferrer">Starbird Skies</a>
        <a class="game-button" href="https://coffeefuelbump-cmd.github.io/geometry-dash/" target="_blank" rel="noopener noreferrer">Geometry Dash</a>
        <a class="game-button" href="https://coffeefuelbump-cmd.github.io/flappy/" target="_blank" rel="noopener noreferrer">Flappy Bird</a>
        <a class="game-button" href="https://sensible-play-pixel-sand.base44.app" target="_blank" rel="noopener noreferrer">Sandboxels</a>
        <a class="game-button" href="https://woodoo-mafia-night-play.base44.app/" target="_blank" rel="noopener noreferrer">Mafia Night</a>
    </div>

    <div class="spacer"></div>
    <div class="beta">BETA TESTING</div>
</body>
</html>
